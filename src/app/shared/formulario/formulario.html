<div class="min-h-[80vh] bg-gray-100 flex items-center justify-center px-4 py-10">

  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-lg">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">
        Crear cuenta
      </h1>

      <p class="text-gray-500 mt-2">
        Regístrate en FITNESS GYM
      </p>
    </div>

    <form (ngSubmit)="registrarUsuario()">

      <div class="mb-4">
        <label class="block mb-2 font-semibold text-gray-700">
          Nombre completo
        </label>

        <input
          [(ngModel)]="nuevoUsuario.nombre"
          name="nombre"
          type="text"
          placeholder="Ingresa tu nombre"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div class="mb-4">
        <label class="block mb-2 font-semibold text-gray-700">
          Correo electrónico
        </label>

        <input
          [(ngModel)]="nuevoUsuario.email"
          name="email"
          type="email"
          placeholder="correo@gmail.com"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <div class="mb-6">
        <label class="block mb-2 font-semibold text-gray-700">
          Contraseña
        </label>

        <input
          [(ngModel)]="nuevoUsuario.password"
          name="password"
          type="password"
          placeholder="********"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <button
        type="submit"
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition"
      >
        REGISTRARSE
      </button>

    </form>

    <div class="text-center mt-6">

      <p class="text-gray-600">
        ¿Ya tienes una cuenta?
      </p>

      <a
        href="/login"
        class="text-blue-700 font-bold hover:underline"
      >
        Iniciar sesión
      </a>

    </div>

  </div>

</div>
