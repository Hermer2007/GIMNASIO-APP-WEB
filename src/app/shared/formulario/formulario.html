<div class="max-w-5xl mx-auto p-6">

  <h1 class="text-3xl font-bold text-center mb-8">
    Registro de Usuarios
  </h1>

  <div
    class="bg-white p-6 rounded-xl shadow-lg mb-10"
  >

    <h2 class="text-xl font-bold mb-4">
      Crear cuenta
    </h2>

    <form
      (ngSubmit)="registrarUsuario()"
      class="grid grid-cols-1 md:grid-cols-3 gap-4"
    >

      <input
        [(ngModel)]="nuevoUsuario.nombre"
        name="nombre"
        type="text"
        placeholder="Nombre completo"
        required
        class="w-full px-4 py-2 border rounded-lg"
      >

      <input
        [(ngModel)]="nuevoUsuario.email"
        name="email"
        type="email"
        placeholder="Correo electrónico"
        required
        class="w-full px-4 py-2 border rounded-lg"
      >

      <input
        [(ngModel)]="nuevoUsuario.password"
        name="password"
        type="password"
        placeholder="Contraseña"
        required
        class="w-full px-4 py-2 border rounded-lg"
      >

      <button
        type="submit"
        class="md:col-span-3 bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-lg"
      >
        REGISTRARSE
      </button>

    </form>

  </div>


  <div class="bg-white rounded-xl shadow-lg overflow-hidden">

    <table class="w-full">

      <thead class="bg-gray-900 text-white">

        <tr>
          <th class="p-4">ID</th>
          <th class="p-4">Nombre</th>
          <th class="p-4">Correo</th>
        </tr>

      </thead>

      <tbody>

        @for (usuario of listaUsuarios(); track usuario.id) {

          <tr class="border-b">

            <td class="p-4">
              {{ usuario.id }}
            </td>

            <td class="p-4">
              {{ usuario.nombre }}
            </td>

            <td class="p-4">
              {{ usuario.email }}
            </td>

          </tr>

        } @empty {

          <tr>
            <td
              colspan="3"
              class="p-6 text-center"
            >
              No existen usuarios registrados.
            </td>
          </tr>

        }

      </tbody>

    </table>

  </div>

</div>
